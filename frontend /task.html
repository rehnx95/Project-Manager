<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depot — Task</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast"></div>
  <div class="app-shell">
    <div id="navHost"></div>
    <main class="main">
      <a class="back-link" id="backLink" href="tasks.html">&larr; Back</a>

      <div class="view-head">
        <div>
          <h2 id="tTitle">&nbsp;</h2>
          <div class="sub mono" id="tMeta"></div>
        </div>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap">
          <span class="stamp" id="tPriorityStamp"></span>
          <span class="stamp" id="tDoneStamp"></span>
          <button class="btn btn-ghost btn-sm" id="toggleCompleteBtn">Toggle complete</button>
          <button class="btn btn-danger btn-sm" id="deleteTaskBtn" hidden>Delete</button>
        </div>
      </div>

      <div class="panel">
        <h3>Edit task</h3>
        <div class="field"><label for="etTitle">Title</label><input id="etTitle" required /></div>
        <div class="field-row">
          <div class="field">
            <label for="etPriority">Priority</label>
            <select id="etPriority"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
          </div>
          <div class="field"><label for="etDueDate">Due date</label><input id="etDueDate" type="datetime-local" required /></div>
        </div>
        <div class="error-text" id="editTaskError"></div>
        <button class="btn btn-primary btn-sm" id="saveTaskBtn">Save changes</button>
      </div>

      <div class="panel">
        <h3>Tags</h3>
        <div id="tagChips" style="margin-bottom:0.8rem"></div>
        <div class="field-row">
          <div class="field" style="flex:2">
            <label for="tagSelect">Attach existing tag</label>
            <select id="tagSelect"></select>
          </div>
          <div class="field" style="flex:0 0 auto; justify-content:flex-end">
            <label>&nbsp;</label>
            <button class="btn btn-sm" id="attachTagBtn">Attach</button>
          </div>
        </div>
        <div class="field-row">
          <div class="field" style="flex:2">
            <label for="newTagName">Or create a new tag</label>
            <input id="newTagName" placeholder="e.g. blocked" />
          </div>
          <div class="field" style="flex:0 0 auto; justify-content:flex-end">
            <label>&nbsp;</label>
            <button class="btn btn-sm" id="createTagBtn">Create</button>
          </div>
        </div>
        <div class="error-text" id="tagError"></div>
      </div>

      <div class="panel">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem">
          <h3 style="margin:0">Comments</h3>
          <button class="btn btn-danger btn-sm" id="clearCommentsBtn" hidden>Clear all</button>
        </div>
        <div id="commentList"></div>
        <form id="newCommentForm" style="margin-top:1rem">
          <div class="field"><label for="ncBody">Add a comment</label><textarea id="ncBody" required></textarea></div>
          <div class="error-text" id="newCommentError"></div>
          <button type="submit" class="btn btn-primary btn-sm">Post comment</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/task.js"></script>
</body>
</html>
