<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depot — My Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast"></div>
  <div class="app-shell">
    <div id="navHost"></div>
    <main class="main">
      <div class="view-head">
        <div>
          <h2>My Tasks</h2>
          <div class="sub">Every task across every project you belong to.</div>
        </div>
      </div>
      <div class="panel task-filters">
        <div class="field"><label for="taskSearch">Search</label><input id="taskSearch" type="search" placeholder="Search tasks" /></div>
        <div class="field"><label for="taskPriority">Priority</label><select id="taskPriority"><option value="">All priorities</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
        <div class="field"><label for="taskCompleted">Status</label><select id="taskCompleted"><option value="">All tasks</option><option value="false">Open</option><option value="true">Completed</option></select></div>
        <div class="field"><label for="taskSort">Sort</label><select id="taskSort"><option value="created_at">Created</option><option value="due_date">Due date</option><option value="title">Title</option><option value="priority">Priority</option></select></div>
        <button class="btn btn-sm" id="applyTaskFilters" type="button">Apply filters</button>
      </div>

      <div class="panel">
        <div id="myTaskList"></div>
        <div class="pagination">
          <button class="btn btn-sm" id="prevPage">&larr; Prev</button>
          <span class="page-info mono" id="pageInfo"></span>
          <button class="btn btn-sm" id="nextPage">Next &rarr;</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
