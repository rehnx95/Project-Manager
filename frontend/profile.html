<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depot — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast"></div>
  <div class="app-shell">
    <div id="navHost"></div>
    <main class="main">
      <div class="view-head">
        <div>
          <h2>Profile</h2>
          <div class="sub">Your name and bio, visible to your project members.</div>
        </div>
      </div>

      <div class="panel" style="max-width:440px">
        <div id="profileDisplay" hidden>
          <h3 id="profileName" style="color:var(--text)"></h3>
          <p class="sub" id="profileBio" style="margin:0.4rem 0 1.2rem"></p>
          <button class="btn btn-sm" id="editProfileBtn">Edit profile</button>
        </div>
        <form id="profileForm">
          <div class="field"><label for="pfName">Name</label><input id="pfName" required /></div>
          <div class="field"><label for="pfBio">Bio</label><textarea id="pfBio" required></textarea></div>
          <div class="error-text" id="profileError"></div>
          <button type="submit" class="btn btn-primary btn-sm" id="profileSubmitBtn">Save profile</button>
        </form>
      </div>

      <div class="panel" style="max-width:440px">
        <h3>Account</h3>
        <form id="emailForm">
          <div class="field"><label for="acEmail">Email</label><input id="acEmail" type="email" required /></div>
          <div class="error-text" id="emailError"></div>
          <button type="submit" class="btn btn-sm">Update email</button>
        </form>
        <hr style="border-color:var(--line); margin:1.2rem 0" />
        <button class="btn btn-danger btn-sm" id="deleteAccountBtn">Delete my account</button>
      </div>

      <div class="panel">
        <h3>My comments</h3>
        <div id="myCommentList"></div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
