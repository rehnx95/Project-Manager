<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depot — Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast"></div>
  <div class="app-shell">
    <div id="navHost"></div>
    <main class="main">
      <div class="view-head">
        <div>
          <h2>Projects</h2>
          <div class="sub">Everything you're a member of.</div>
        </div>
        <button class="btn btn-primary btn-sm" id="newProjectBtn">+ New project</button>
      </div>

      <form class="panel" id="newProjectForm" hidden>
        <h3>New project</h3>
        <div class="field">
          <label for="npName">Name</label>
          <input id="npName" required minlength="3" />
        </div>
        <div class="field">
          <label for="npDescription">Description</label>
          <textarea id="npDescription" required></textarea>
        </div>
        <div class="field">
          <label for="npStatus">Status</label>
          <select id="npStatus">
            <option value="active">Active</option>
            <option value="archived">Archived</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="error-text" id="newProjectError"></div>
        <div style="display:flex; gap:0.6rem">
          <button type="submit" class="btn btn-primary btn-sm">Save project</button>
          <button type="button" class="btn btn-ghost btn-sm" id="cancelNewProject">Cancel</button>
        </div>
      </form>

      <div id="projectsGrid"></div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
