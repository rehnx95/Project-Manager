<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>API Console</title>
    <link rel="stylesheet" href="css/testing.css" />
  </head>
  <body>
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Toggle endpoint list">
        ☰
      </button>
      <div class="brand">API<span>·</span>CONSOLE</div>
      <div class="origin-note" id="originNote"></div>
      <div class="topbar-fields">
        <div class="field token-field">
          <label for="tokenInput">Bearer token</label>
          <input
            id="tokenInput"
            placeholder="paste token after login…"
            spellcheck="false"
          />
        </div>
      </div>
      <div class="topbar-actions">
        <div class="status-dot" id="tokenDot" title="No token set"></div>
        <button class="pill-btn" id="clearTokenBtn">
          <span class="pill-label">Clear </span>token
        </button>
      </div>
    </div>

    <div class="scrim" id="scrim"></div>

    <div class="layout">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-search">
          <input
            id="endpointSearch"
            type="search"
            placeholder="Search endpoints… (/)"
            spellcheck="false"
            autocomplete="off"
          />
        </div>
        <div class="sidebar-list" id="sidebarList"></div>
      </div>

      <div class="request-panel mobile-active" id="requestPanel">
        <div class="empty-note">
          Pick an endpoint on the left to build a request.
        </div>
      </div>

      <div class="response-panel" id="responsePanel">
        <div class="section-label">Response</div>
        <div class="resp-placeholder">Nothing sent yet.</div>
        <div class="history" id="historyWrap" style="display: none">
          <div class="history-head">
            <div class="section-label" style="margin: 0">
              History (this session)
            </div>
            <button class="history-clear" id="historyClearBtn">clear</button>
          </div>
          <div id="historyList"></div>
        </div>
      </div>
    </div>

    <div class="mobile-tabs" id="mobileTabs">
      <button data-tab="request" class="active">Request</button>
      <button data-tab="response">Response</button>
    </div>

    <script src="js/testing.js"></script>
  </body>
</html>
