<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depot — Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast"></div>
  <div class="app-shell">
    <div id="navHost"></div>
    <main class="main">
      <div class="view-head">
        <div>
          <h2>Notes</h2>
          <div class="sub">Personal notes — only visible to you.</div>
        </div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap">
          <button class="btn btn-sm" id="newNoteBtn">+ New note</button>
          <button class="btn btn-danger btn-sm" id="clearNotesBtn">Clear all</button>
        </div>
      </div>

      <form class="panel" id="newNoteForm" hidden>
        <h3>New note</h3>
        <div class="field"><label for="nnTitle">Title</label><input id="nnTitle" required /></div>
        <div class="field"><label for="nnBody">Body</label><textarea id="nnBody" required></textarea></div>
        <div class="error-text" id="newNoteError"></div>
        <div style="display:flex; gap:0.6rem">
          <button type="submit" class="btn btn-primary btn-sm">Save note</button>
          <button type="button" class="btn btn-ghost btn-sm" id="cancelNewNote">Cancel</button>
        </div>
      </form>

      <div id="noteList"></div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/notes.js"></script>
</body>
</html>
