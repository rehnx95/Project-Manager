<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depot — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast"></div>
  <div class="app-shell">
    <div id="navHost"></div>
    <main class="main">
      <div class="view-head">
        <div>
          <h2>Admin</h2>
          <div class="sub">All registered users.</div>
        </div>
      </div>

      <div id="adminContent">
        <div class="panel">
          <h3>Look up by ID</h3>
          <div class="field-row">
            <div class="field" style="flex:2"><label for="lookupId">User ID</label><input id="lookupId" placeholder="uuid" /></div>
            <div class="field" style="flex:0 0 auto; justify-content:flex-end"><label>&nbsp;</label><button class="btn btn-sm" id="lookupBtn">Look up</button></div>
          </div>
          <div class="error-text" id="lookupError"></div>
          <div id="lookupResult"></div>
        </div>

        <div class="panel">
          <h3>All users</h3>
          <div class="table-wrap">
            <table class="simple" id="usersTable">
              <thead><tr><th>Email</th><th>Role</th><th>ID</th></tr></thead>
              <tbody id="usersTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
