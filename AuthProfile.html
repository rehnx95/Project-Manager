<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depot — Project Dispatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #12161d;
        --panel: #1a2029;
        --panel-raised: #212938;
        --line: #2a3140;
        --paper: #efe7d6;
        --paper-ink: #2b2a25;
        --amber: #e3a23b;
        --amber-dim: #8a6423;
        --urgent: #d6584a;
        --standard: #5c8fd6;
        --routine: #4fa98c;
        --text: #e7e9ee;
        --muted: #8993a6;
        --radius: 10px;
        --display: "Oswald", sans-serif;
        --body: "IBM Plex Sans", sans-serif;
        --mono: "IBM Plex Mono", monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--ink);
        color: var(--text);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.5;
        min-height: 100%;
      }
      h1,
      h2,
      h3,
      .wordmark,
      .stamp,
      .eyebrow {
        font-family: var(--display);
      }
      .mono {
        font-family: var(--mono);
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }
      a {
        color: inherit;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ---------- shared bits ---------- */
      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.6rem 1.1rem;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel-raised);
        color: var(--text);
        font-weight: 500;
        transition:
          transform 0.12s ease,
          border-color 0.12s ease,
          background 0.12s ease;
      }
      .btn:hover {
        border-color: var(--amber-dim);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: default;
        transform: none;
      }
      .btn-primary {
        background: var(--amber);
        border-color: var(--amber);
        color: #1a1204;
        font-weight: 600;
      }
      .btn-primary:hover {
        border-color: #f0b158;
        background: #f0b158;
      }
      .btn-ghost {
        background: transparent;
      }
      .btn-danger {
        border-color: #5c2a24;
        color: #f2a89e;
        background: transparent;
      }
      .btn-danger:hover {
        border-color: var(--urgent);
      }
      .btn-sm {
        padding: 0.35rem 0.7rem;
        font-size: 0.82rem;
        border-radius: 5px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin-bottom: 1rem;
      }
      .field label {
        font-size: 0.78rem;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .field input,
      .field select,
      .field textarea {
        background: #0f131a;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.6rem 0.7rem;
        color: var(--text);
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--amber-dim);
      }
      .field textarea {
        resize: vertical;
        min-height: 70px;
      }
      .field-row {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .field-row .field {
        flex: 1;
        min-width: 150px;
      }
      .error-text {
        color: #f2a89e;
        font-size: 0.82rem;
        min-height: 1.1em;
      }

      .stamp {
        display: inline-block;
        font-size: 0.68rem;
        letter-spacing: 0.09em;
        font-weight: 600;
        text-transform: uppercase;
        padding: 0.22rem 0.55rem;
        border: 1.5px dashed currentColor;
        border-radius: 4px;
        transform: rotate(-3deg);
        white-space: nowrap;
      }
      .stamp--low,
      .stamp--active {
        color: var(--routine);
      }
      .stamp--medium {
        color: var(--standard);
      }
      .stamp--high {
        color: var(--urgent);
      }
      .stamp--archived {
        color: var(--muted);
      }
      .stamp--completed {
        color: var(--amber);
      }

      /* ---------- toast ---------- */
      #toast {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 999;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 320px;
      }
      .toast-msg {
        background: var(--panel-raised);
        border: 1px solid var(--line);
        border-left: 3px solid var(--amber);
        padding: 0.7rem 0.9rem;
        border-radius: 6px;
        font-size: 0.85rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        animation: toast-in 0.18s ease;
      }
      .toast-msg.is-error {
        border-left-color: var(--urgent);
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ---------- auth screen ---------- */
      #authScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(ellipse at top left, #1c2431 0%, transparent 55%),
          radial-gradient(ellipse at bottom right, #1a2129 0%, transparent 55%),
          var(--ink);
      }
      .ticket {
        position: relative;
        width: 100%;
        max-width: 400px;
        background: var(--paper);
        color: var(--paper-ink);
        border-radius: 6px;
        padding: 2.4rem 2.1rem 2rem;
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.55);
        animation: rise 0.35s ease;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .ticket::before,
      .ticket::after {
        content: "";
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
        background: var(--ink);
        border-radius: 50%;
      }
      .ticket::before {
        left: -13px;
      }
      .ticket::after {
        right: -13px;
      }
      .ticket h1 {
        font-size: 1.7rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin: 0.3rem 0 0.15rem;
      }
      .ticket .sub {
        font-size: 0.85rem;
        color: #5c5a4f;
        margin-bottom: 1.4rem;
      }
      .ticket-divider {
        border: none;
        border-top: 2px dashed #cfc6ad;
        margin: 1.4rem 0;
      }
      .tabs {
        display: flex;
        gap: 0;
        margin-bottom: 1.5rem;
        border-bottom: 2px dashed #cfc6ad;
      }
      .tab {
        flex: 1;
        text-align: center;
        padding: 0.55rem 0;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        color: #8a8674;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
      }
      .tab.is-active {
        color: var(--paper-ink);
        border-bottom-color: var(--paper-ink);
      }
      .auth-form {
        display: none;
      }
      .auth-form.is-active {
        display: block;
      }
      .ticket .field input {
        background: #fbf8f0;
        border: 1px solid #cfc6ad;
        color: var(--paper-ink);
      }
      .ticket .field label {
        color: #7a7767;
      }
      .ticket .btn-primary {
        width: 100%;
        margin-top: 0.3rem;
      }

      /* ---------- app shell ---------- */
      #appShell {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 220px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 1.4rem 1.1rem;
      }
      .wordmark {
        font-size: 1.3rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        margin-bottom: 0.15rem;
      }
      .wordmark .dot {
        color: var(--amber);
      }
      .tagline {
        font-size: 0.68rem;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 2rem;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        flex: 1;
      }
      .navbtn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        background: none;
        border: none;
        text-align: left;
        padding: 0.6rem 0.7rem;
        border-radius: 6px;
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 500;
      }
      .navbtn:hover {
        background: var(--panel-raised);
        color: var(--text);
      }
      .navbtn.is-active {
        background: var(--panel-raised);
        color: var(--amber);
      }
      .navbtn .ico {
        width: 1.1em;
        text-align: center;
      }
      .sidebar-foot {
        border-top: 1px solid var(--line);
        padding-top: 1rem;
        margin-top: 1rem;
      }
      .who {
        font-size: 0.8rem;
        color: var(--muted);
        word-break: break-all;
        margin-bottom: 0.7rem;
      }
      .clock {
        font-size: 0.7rem;
        color: #4d5566;
        letter-spacing: 0.05em;
        margin-top: 0.8rem;
      }

      .main {
        flex: 1;
        padding: 2.2rem 2.6rem;
        max-width: 1080px;
      }
      .view {
        display: none;
        animation: fade 0.2s ease;
      }
      .view.is-active {
        display: block;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .view-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.6rem;
        flex-wrap: wrap;
      }
      .view-head h2 {
        font-size: 1.7rem;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .view-head .sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 0.2rem;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.4rem;
        margin-bottom: 1.4rem;
      }
      .panel h3 {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-bottom: 1rem;
        color: var(--amber);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 3px solid var(--amber-dim);
        border-radius: 8px;
        padding: 1.1rem 1.15rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        transition: border-color 0.15s ease;
      }
      .card:hover {
        border-left-color: var(--amber);
      }
      .card h4 {
        font-size: 1.05rem;
        font-family: var(--display);
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      .card p {
        font-size: 0.85rem;
        color: var(--muted);
        flex: 1;
      }
      .card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .card-actions {
        display: flex;
        gap: 0.4rem;
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        padding: 2.2rem 1.5rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .task-row {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        padding: 0.8rem 0.9rem;
        border: 1px solid var(--line);
        border-left: 3px solid var(--standard);
        border-radius: 7px;
        background: var(--panel);
        margin-bottom: 0.55rem;
      }
      .task-row.priority-high {
        border-left-color: var(--urgent);
      }
      .task-row.priority-low {
        border-left-color: var(--routine);
      }
      .task-row.is-done {
        opacity: 0.55;
      }
      .task-row.is-done .task-title {
        text-decoration: line-through;
      }
      .task-check {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--line);
        background: none;
        flex-shrink: 0;
      }
      .task-row.is-done .task-check {
        background: var(--amber);
        border-color: var(--amber);
      }
      .task-title {
        flex: 1;
        min-width: 120px;
        font-weight: 500;
      }
      .task-meta {
        font-size: 0.75rem;
        color: var(--muted);
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--muted);
        font-size: 0.82rem;
        margin-bottom: 1rem;
        background: none;
        border: none;
      }
      .back-link:hover {
        color: var(--amber);
      }

      .id-badge {
        color: var(--muted);
        font-size: 0.72rem;
      }

      /* ---------- responsive ---------- */
      @media (max-width: 800px) {
        #appShell {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          flex-direction: row;
          align-items: center;
          padding: 0.8rem 1rem;
          border-right: none;
          border-bottom: 1px solid var(--line);
          gap: 1rem;
        }
        .wordmark,
        .tagline,
        .sidebar-foot .who,
        .clock {
          display: none;
        }
        .nav {
          flex-direction: row;
          flex: 1;
        }
        .navbtn {
          flex: 1;
          justify-content: center;
        }
        .sidebar-foot {
          border: none;
          padding: 0;
          margin: 0;
        }
        .main {
          padding: 1.4rem 1.1rem;
        }
        .field-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="toast"></div>

    <!-- ================= AUTH ================= -->
    <div id="authScreen">
      <div class="ticket">
        <div class="eyebrow">Depot &middot; Access Terminal</div>
        <h1 id="authHeading">Sign in</h1>
        <p class="sub">Track projects and tasks in one dispatch board.</p>

        <div class="tabs">
          <button class="tab is-active" data-tab="login">Sign in</button>
          <button class="tab" data-tab="register">Register</button>
        </div>

        <form id="loginForm" class="auth-form is-active">
          <div class="field">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input
              id="loginPassword"
              type="password"
              required
              autocomplete="current-password"
            />
          </div>
          <div class="error-text" id="loginError"></div>
          <button type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <form id="registerForm" class="auth-form">
          <div class="field">
            <label for="registerEmail">Email</label>
            <input
              id="registerEmail"
              type="email"
              required
              autocomplete="email"
            />
          </div>
          <div class="field">
            <label for="registerPassword">Password</label>
            <input
              id="registerPassword"
              type="password"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>
          <div class="error-text" id="registerError"></div>
          <button type="submit" class="btn btn-primary">Create account</button>
        </form>
      </div>
    </div>

    <!-- ================= APP ================= -->
    <div id="appShell" hidden>
      <aside class="sidebar">
        <div>
          <div class="wordmark">Depot<span class="dot">.</span></div>
          <div class="tagline">Project dispatch</div>
        </div>
        <nav class="nav">
          <button class="navbtn is-active" data-view="projects">
            <span class="ico">&#9635;</span> Projects
          </button>
          <button class="navbtn" data-view="profile">
            <span class="ico">&#9673;</span> Profile
          </button>
        </nav>
        <div class="sidebar-foot">
          <div class="who mono" id="whoLabel"></div>
          <button
            class="btn btn-ghost btn-sm"
            id="logoutBtn"
            style="width: 100%"
          >
            Sign out
          </button>
          <div class="clock mono" id="clock"></div>
        </div>
      </aside>

      <main class="main">
        <!-- Projects -->
        <section class="view is-active" id="view-projects">
          <div class="view-head">
            <div>
              <h2>Projects</h2>
              <div class="sub">Everything you're a member of.</div>
            </div>
            <button class="btn btn-primary btn-sm" id="newProjectBtn">
              + New project
            </button>
          </div>

          <form class="panel" id="newProjectForm" hidden>
            <h3>New project</h3>
            <div class="field">
              <label for="npName">Name</label>
              <input id="npName" required minlength="3" />
            </div>
            <div class="field">
              <label for="npDescription">Description</label>
              <textarea id="npDescription" required></textarea>
            </div>
            <div class="field">
              <label for="npStatus">Status</label>
              <select id="npStatus">
                <option value="active">Active</option>
                <option value="archived">Archived</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="error-text" id="newProjectError"></div>
            <div style="display: flex; gap: 0.6rem">
              <button type="submit" class="btn btn-primary btn-sm">
                Save project
              </button>
              <button
                type="button"
                class="btn btn-ghost btn-sm"
                id="cancelNewProject"
              >
                Cancel
              </button>
            </div>
          </form>

          <div id="projectsGrid"></div>
        </section>

        <!-- Project detail -->
        <section class="view" id="view-projectDetail">
          <button class="back-link" id="backToProjects">
            &larr; All projects
          </button>

          <div class="panel" id="projectEditPanel" hidden>
            <h3>Edit project</h3>
            <div class="field">
              <label for="epName">Name</label>
              <input id="epName" required minlength="3" />
            </div>
            <div class="field">
              <label for="epDescription">Description</label>
              <textarea id="epDescription" required></textarea>
            </div>
            <div class="field">
              <label for="epStatus">Status</label>
              <select id="epStatus">
                <option value="active">Active</option>
                <option value="archived">Archived</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="error-text" id="editProjectError"></div>
            <div style="display: flex; gap: 0.6rem">
              <button
                type="button"
                class="btn btn-primary btn-sm"
                id="saveProjectEdit"
              >
                Save changes
              </button>
              <button
                type="button"
                class="btn btn-ghost btn-sm"
                id="cancelProjectEdit"
              >
                Cancel
              </button>
            </div>
          </div>

          <div class="view-head">
            <div>
              <h2 id="pdName">&nbsp;</h2>
              <div class="sub" id="pdDescription"></div>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center">
              <span class="stamp" id="pdStatusStamp"></span>
              <button class="btn btn-ghost btn-sm" id="editProjectBtn">
                Edit
              </button>
              <button class="btn btn-danger btn-sm" id="deleteProjectBtn">
                Delete
              </button>
            </div>
          </div>

          <div class="panel">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 1rem;
              "
            >
              <h3 style="margin: 0">Tasks</h3>
              <button class="btn btn-sm" id="newTaskBtn">+ Add task</button>
            </div>

            <form id="newTaskForm" hidden style="margin-bottom: 1.2rem">
              <div class="field">
                <label for="ntTitle">Title</label>
                <input id="ntTitle" required />
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="ntPriority">Priority</label>
                  <select id="ntPriority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                  </select>
                </div>
                <div class="field">
                  <label for="ntDueDate">Due date</label>
                  <input id="ntDueDate" type="datetime-local" required />
                </div>
              </div>
              <div class="error-text" id="newTaskError"></div>
              <div style="display: flex; gap: 0.6rem">
                <button type="submit" class="btn btn-primary btn-sm">
                  Save task
                </button>
                <button
                  type="button"
                  class="btn btn-ghost btn-sm"
                  id="cancelNewTask"
                >
                  Cancel
                </button>
              </div>
            </form>

            <div id="taskList"></div>
          </div>
        </section>

        <!-- Profile -->
        <section class="view" id="view-profile">
          <div class="view-head">
            <div>
              <h2>Profile</h2>
              <div class="sub">
                Your name and bio, visible to your project members.
              </div>
            </div>
          </div>

          <div class="panel" style="max-width: 440px">
            <div id="profileDisplay" hidden>
              <h3 id="profileName" style="color: var(--text)"></h3>
              <p
                class="sub"
                id="profileBio"
                style="margin: 0.4rem 0 1.2rem"
              ></p>
              <button class="btn btn-sm" id="editProfileBtn">
                Edit profile
              </button>
            </div>

            <form id="profileForm">
              <div class="field">
                <label for="pfName">Name</label>
                <input id="pfName" required />
              </div>
              <div class="field">
                <label for="pfBio">Bio</label>
                <textarea id="pfBio" required></textarea>
              </div>
              <div class="error-text" id="profileError"></div>
              <button
                type="submit"
                class="btn btn-primary btn-sm"
                id="profileSubmitBtn"
              >
                Save profile
              </button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script>
      // ---------------------------------------------------------------
      // Point this at wherever your Express server is running.
      // Your .env has PORT=8000, so that's the default here.
      // ---------------------------------------------------------------
      const API_BASE = "http://localhost:8000";

      const state = {
        token: null,
        email: null,
        currentProjectId: null,
        currentProject: null,
        hasProfile: false,
      };

      // ---------- helpers ----------
      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str == null ? "" : String(str);
        return d.innerHTML;
      }

      function toast(message, isError) {
        const el = document.createElement("div");
        el.className = "toast-msg" + (isError ? " is-error" : "");
        el.textContent = message;
        document.getElementById("toast").appendChild(el);
        setTimeout(() => el.remove(), 3800);
      }

      async function api(path, opts = {}) {
        const headers = {
          "Content-Type": "application/json",
          ...(opts.headers || {}),
        };
        if (state.token) headers["Authorization"] = "Bearer " + state.token;
        let res;
        try {
          res = await fetch(API_BASE + path, { ...opts, headers });
        } catch (networkErr) {
          throw new Error(
            "Could not reach the server. Is the backend running on " +
              API_BASE +
              "?",
          );
        }
        let data = null;
        try {
          data = await res.json();
        } catch (e) {
          /* e.g. 204 No Content */
        }
        if (!res.ok) {
          const raw = data && data.error;
          const msg = Array.isArray(raw)
            ? raw.join(", ")
            : raw || "Request failed (" + res.status + ")";
          throw new Error(msg);
        }
        return data;
      }

      function toISODateTime(localValue) {
        return new Date(localValue).toISOString();
      }
      function formatDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso.replace(" ", "T"));
        if (isNaN(d)) return iso;
        return d.toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      }

      // ---------- view switching ----------
      function showView(name) {
        document
          .querySelectorAll(".view")
          .forEach((v) => v.classList.remove("is-active"));
        document.getElementById("view-" + name).classList.add("is-active");
        document
          .querySelectorAll(".navbtn")
          .forEach((b) =>
            b.classList.toggle("is-active", b.dataset.view === name),
          );
      }

      document.querySelectorAll(".navbtn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const view = btn.dataset.view;
          showView(view);
          if (view === "projects") loadProjects();
          if (view === "profile") loadProfile();
        });
      });

      // ---------- auth tabs ----------
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.remove("is-active"));
          document
            .querySelectorAll(".auth-form")
            .forEach((f) => f.classList.remove("is-active"));
          tab.classList.add("is-active");
          document
            .getElementById(tab.dataset.tab + "Form")
            .classList.add("is-active");
          document.getElementById("authHeading").textContent =
            tab.dataset.tab === "login" ? "Sign in" : "Register";
        });
      });

      // ---------- signup / login ----------
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errEl = document.getElementById("registerError");
          errEl.textContent = "";
          const email = document.getElementById("registerEmail").value;
          const password = document.getElementById("registerPassword").value;
          try {
            await api("/users/signup", {
              method: "POST",
              body: JSON.stringify({ email, password }),
            });
            toast("Account created — you can sign in now.");
            document.querySelector('[data-tab="login"]').click();
            document.getElementById("loginEmail").value = email;
          } catch (err) {
            errEl.textContent = err.message;
          }
        });

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errEl = document.getElementById("loginError");
          errEl.textContent = "";
          const email = document.getElementById("loginEmail").value;
          const password = document.getElementById("loginPassword").value;
          try {
            const data = await api("/users/login", {
              method: "POST",
              body: JSON.stringify({ email, password }),
            });
            state.token = data.token;
            state.email = email;
            enterApp();
          } catch (err) {
            errEl.textContent = err.message;
          }
        });

      document.getElementById("logoutBtn").addEventListener("click", () => {
        state.token = null;
        state.email = null;
        state.currentProjectId = null;
        document.getElementById("appShell").hidden = true;
        document.getElementById("authScreen").hidden = false;
        document.getElementById("loginForm").reset();
      });

      function enterApp() {
        document.getElementById("authScreen").hidden = true;
        document.getElementById("appShell").hidden = false;
        document.getElementById("whoLabel").textContent = state.email;
        showView("projects");
        loadProjects();
      }

      // ---------- clock (ambient detail) ----------
      function tickClock() {
        const el = document.getElementById("clock");
        const now = new Date();
        el.textContent = now.toLocaleTimeString(undefined, { hour12: false });
      }
      setInterval(tickClock, 1000);
      tickClock();

      // ---------- projects ----------
      document.getElementById("newProjectBtn").addEventListener("click", () => {
        document.getElementById("newProjectForm").hidden = false;
      });
      document
        .getElementById("cancelNewProject")
        .addEventListener("click", () => {
          document.getElementById("newProjectForm").hidden = true;
          document.getElementById("newProjectForm").reset();
        });

      document
        .getElementById("newProjectForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errEl = document.getElementById("newProjectError");
          errEl.textContent = "";
          const name = document.getElementById("npName").value;
          const description = document.getElementById("npDescription").value;
          const status = document.getElementById("npStatus").value;
          try {
            await api("/projects", {
              method: "POST",
              body: JSON.stringify({ name, description, status }),
            });
            document.getElementById("newProjectForm").reset();
            document.getElementById("newProjectForm").hidden = true;
            toast("Project created.");
            loadProjects();
          } catch (err) {
            errEl.textContent = err.message;
          }
        });

      async function loadProjects() {
        const grid = document.getElementById("projectsGrid");
        grid.innerHTML = '<div class="empty">Loading projects…</div>';
        let projects = [];
        try {
          const data = await api("/projects");
          projects = data.value || [];
        } catch (err) {
          // Backend reports "Project Not Exist" when the user has none yet — treat as empty state.
          projects = [];
        }
        if (projects.length === 0) {
          grid.innerHTML =
            '<div class="empty">No projects yet — create your first one to get moving.</div>';
          return;
        }
        grid.innerHTML = '<div class="grid"></div>';
        const gridInner = grid.querySelector(".grid");
        projects.forEach((p) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            '<div class="card-foot"><h4>' +
            esc(p.project_name) +
            '</h4><span class="stamp stamp--' +
            esc(p.status) +
            '">' +
            esc(p.status) +
            "</span></div>" +
            "<p>" +
            esc(p.description) +
            "</p>" +
            '<div class="card-foot"><span class="id-badge mono">Created ' +
            formatDate(p.created_at) +
            "</span>" +
            '<button class="btn btn-sm" data-open="' +
            esc(p.id) +
            '">Open</button></div>';
          gridInner.appendChild(card);
        });
        gridInner.querySelectorAll("[data-open]").forEach((btn) => {
          btn.addEventListener("click", () => openProject(btn.dataset.open));
        });
      }

      document
        .getElementById("backToProjects")
        .addEventListener("click", () => {
          showView("projects");
          loadProjects();
        });

      async function openProject(id) {
        try {
          const data = await api("/projects/" + id);
          state.currentProjectId = id;
          state.currentProject = data.value;
          renderProjectDetail();
          showView("projectDetail");
          loadTasks();
        } catch (err) {
          toast(err.message, true);
        }
      }

      function renderProjectDetail() {
        const p = state.currentProject;
        document.getElementById("pdName").textContent = p.project_name;
        document.getElementById("pdDescription").textContent = p.description;
        const stamp = document.getElementById("pdStatusStamp");
        stamp.textContent = p.status;
        stamp.className = "stamp stamp--" + p.status;
        document.getElementById("projectEditPanel").hidden = true;
      }

      document
        .getElementById("editProjectBtn")
        .addEventListener("click", () => {
          const p = state.currentProject;
          document.getElementById("epName").value = p.project_name;
          document.getElementById("epDescription").value = p.description;
          document.getElementById("epStatus").value = p.status;
          document.getElementById("editProjectError").textContent = "";
          document.getElementById("projectEditPanel").hidden = false;
        });
      document
        .getElementById("cancelProjectEdit")
        .addEventListener("click", () => {
          document.getElementById("projectEditPanel").hidden = true;
        });
      document
        .getElementById("saveProjectEdit")
        .addEventListener("click", async () => {
          const errEl = document.getElementById("editProjectError");
          errEl.textContent = "";
          const name = document.getElementById("epName").value;
          const description = document.getElementById("epDescription").value;
          const status = document.getElementById("epStatus").value;
          try {
            const data = await api("/projects/" + state.currentProjectId, {
              method: "PATCH",
              body: JSON.stringify({ name, description, status }),
            });
            state.currentProject = data.value;
            renderProjectDetail();
            toast("Project updated.");
          } catch (err) {
            errEl.textContent = err.message;
          }
        });

      document
        .getElementById("deleteProjectBtn")
        .addEventListener("click", async () => {
          if (!confirm("Delete this project? This cannot be undone.")) return;
          try {
            await api("/projects/" + state.currentProjectId, {
              method: "DELETE",
            });
            toast("Project deleted.");
            showView("projects");
            loadProjects();
          } catch (err) {
            toast(err.message, true);
          }
        });

      // ---------- tasks ----------
      document.getElementById("newTaskBtn").addEventListener("click", () => {
        document.getElementById("newTaskForm").hidden = false;
      });
      document.getElementById("cancelNewTask").addEventListener("click", () => {
        document.getElementById("newTaskForm").hidden = true;
        document.getElementById("newTaskForm").reset();
      });

      document
        .getElementById("newTaskForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errEl = document.getElementById("newTaskError");
          errEl.textContent = "";
          const title = document.getElementById("ntTitle").value;
          const priority = document.getElementById("ntPriority").value;
          const dueLocal = document.getElementById("ntDueDate").value;
          try {
            const due_date = toISODateTime(dueLocal);
            await api("/projects/" + state.currentProjectId + "/tasks", {
              method: "POST",
              body: JSON.stringify({ title, priority, due_date }),
            });
            document.getElementById("newTaskForm").reset();
            document.getElementById("newTaskForm").hidden = true;
            toast("Task added.");
            loadTasks();
          } catch (err) {
            errEl.textContent = err.message;
          }
        });

      async function loadTasks() {
        const list = document.getElementById("taskList");
        list.innerHTML = '<div class="empty">Loading tasks…</div>';
        let tasks = [];
        try {
          const data = await api(
            "/projects/" + state.currentProjectId + "/tasks",
          );
          tasks = data.value || [];
        } catch (err) {
          toast(err.message, true);
          tasks = [];
        }
        if (tasks.length === 0) {
          list.innerHTML =
            '<div class="empty">No tasks in this project yet.</div>';
          return;
        }
        list.innerHTML = "";
        tasks.forEach((t) => {
          const row = document.createElement("div");
          row.className =
            "task-row priority-" + t.priority + (t.completed ? " is-done" : "");
          row.innerHTML =
            '<button class="task-check" data-complete="' +
            t.id +
            '" title="Toggle complete"></button>' +
            '<span class="task-title">' +
            esc(t.title) +
            "</span>" +
            '<span class="stamp stamp--' +
            t.priority +
            '">' +
            t.priority +
            "</span>" +
            '<span class="task-meta mono">Due ' +
            formatDate(t.due_date) +
            "</span>" +
            '<button class="btn btn-danger btn-sm" data-delete="' +
            t.id +
            '">Delete</button>';
          list.appendChild(row);
        });
        list.querySelectorAll("[data-complete]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            try {
              await api("/tasks/" + btn.dataset.complete + "/complete", {
                method: "PATCH",
              });
              loadTasks();
            } catch (err) {
              toast(err.message, true);
            }
          });
        });
        list.querySelectorAll("[data-delete]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("Delete this task?")) return;
            try {
              await api("/tasks/" + btn.dataset.delete, { method: "DELETE" });
              toast("Task deleted.");
              loadTasks();
            } catch (err) {
              toast(err.message, true);
            }
          });
        });
      }

      // ---------- profile ----------
      async function loadProfile() {
        const display = document.getElementById("profileDisplay");
        const form = document.getElementById("profileForm");
        const errEl = document.getElementById("profileError");
        errEl.textContent = "";
        try {
          const data = await api("/users/profile");
          state.hasProfile = true;
          document.getElementById("profileName").textContent = data.value.name;
          document.getElementById("profileBio").textContent = data.value.bio;
          document.getElementById("pfName").value = data.value.name;
          document.getElementById("pfBio").value = data.value.bio;
          display.hidden = false;
          form.hidden = true;
          document.getElementById("profileSubmitBtn").textContent =
            "Save profile";
        } catch (err) {
          // "Profile Not Exist" -> no profile yet, show the create form directly.
          state.hasProfile = false;
          display.hidden = true;
          form.hidden = false;
          document.getElementById("pfName").value = "";
          document.getElementById("pfBio").value = "";
          document.getElementById("profileSubmitBtn").textContent =
            "Create profile";
        }
      }

      document
        .getElementById("editProfileBtn")
        .addEventListener("click", () => {
          document.getElementById("profileDisplay").hidden = true;
          document.getElementById("profileForm").hidden = false;
        });

      document
        .getElementById("profileForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errEl = document.getElementById("profileError");
          errEl.textContent = "";
          const name = document.getElementById("pfName").value;
          const bio = document.getElementById("pfBio").value;
          try {
            if (state.hasProfile) {
              await api("/users/profile", {
                method: "PATCH",
                body: JSON.stringify({ name, bio }),
              });
            } else {
              await api("/users/profile", {
                method: "POST",
                body: JSON.stringify({ name, bio }),
              });
            }
            toast("Profile saved.");
            loadProfile();
          } catch (err) {
            errEl.textContent = err.message;
          }
        });
    </script>
  </body>
</html>
